name: pos-system

x-backend: &backend
  image: pos-system-backend
  env_file: .env.docker
  environment:
    DATABASE_URL: postgresql+psycopg://pos:${POSTGRES_PASSWORD:?Run make init first}@db:5432/pos_system
    UPLOAD_DIR: /app/uploads
  volumes:
    - ./app:/app/app
    - ./alembic:/app/alembic
    - ./alembic.ini:/app/alembic.ini:ro
    - uploads:/app/uploads

services:
  db:
    image: pos-system-db
    build:
      context: .
      dockerfile: docker/postgres.Dockerfile
    environment:
      POSTGRES_INITDB_ARGS: --auth-local=scram-sha-256 --auth-host=scram-sha-256
      POSTGRES_USER: pos
      POSTGRES_DB: pos_system
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run make init first}
    ports:
      - "127.0.0.1:${DB_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pos -d pos_system"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_interval: 3s
      start_period: 30s
    restart: unless-stopped

  migrate:
    <<: *backend
    command: ["sh", "-c", "alembic upgrade head && python -m app.scripts.seed_all"]
    depends_on:
      db:
        condition: service_healthy

  backend:
    <<: *backend
    build: .
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8001}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_interval: 3s
      start_period: 30s
    restart: unless-stopped

  frontend:
    image: pos-system-frontend
    init: true
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      VITE_API_BASE_URL: /api/v1
      VITE_API_PROXY_TARGET: http://backend:8000
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5174}:5173"
    volumes:
      - ./frontend/src:/app/frontend/src
      - ./frontend/index.html:/app/frontend/index.html:ro
      - ./frontend/vite.config.ts:/app/frontend/vite.config.ts:ro
      - ./docs:/app/docs:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_interval: 3s
      start_period: 30s
    restart: unless-stopped

volumes:
  postgres_data:
  uploads:
